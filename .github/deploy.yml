name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]

  # ఒకవేళ మాన్యువల్‌గా రన్ చేయాలనుకుంటే ఉపయోగపడుతుంది
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          git remote add hf https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/CyberGuard-AI-Powered-Agent
          git push --force hf main